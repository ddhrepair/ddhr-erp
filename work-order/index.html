<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../styles.css">

    <!--- Declare the icons for the webpage --->
    <link rel="icon" href="images/DDHR_Logo.svg" />
    <link rel="apple-touch-icon" href="images/full.png">
    <link rel="mask-icon" href="images/masked.png" color="#000000">

    <title>Work Order</title>
</head>

<body>

    <!-- Login area -->
    <div id="loginContainer">

        <img src="../images/DDHR_Logo.svg">

        <div>

            <div class="hidden">

                <h2>Sign In</h2>

                <div id="googleLoginButton"></div>

            </div>

            <div class="hidden">

                <h2>Signing In...</h2>

                <img src="../images/loading.gif">

            </div>

            <div>

                <h2>Loading...</h2>

                <img src="../images/loading.gif">

            </div>

        </div>

    </div>

    <div id="workOrderData">
        <div id="splitLeft">

            <div id="woCustomerInfo">

                <div>
                    <div id="name"></div>
                    <div id="otherCustomerInfo"></div>
                </div>
                <div>
                    <div id="taxExempt"></div>
                    <div id="taxExemptFormLink"></div>
                    <div id="customerLevel"></div>
                    <div id="customerColor">Color: </div>
                </div>

            </div>

            <div id="woInfoContainer">

                <div>
                    <div>
                        <div id="po"></div>
                        <div id="status"></div>
                    </div>
                    <div id="dates">
                        <div id="dateCreated"></div>
                        <div id="lastModified"></div>
                    </div>
                    <div id="totals">
                        <div>
                            <label>SubTotal:</label>
                            <label>Tax <small>(6.875%)</small>:</label>
                            <label>Total:</label>
                        </div>
                        <div>
                            <div id="subTotal">$100.00</div>
                            <div id="tax">$6.88</div>
                            <div id="total">$106.88</div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="tableContainer">
                <div id="woParts">

                    <table>
                        <thead>
                            <tr>
                                <th class="small">QTY</th>
                                <th class="medium">Part #</th>
                                <th class="auto">Description</th>
                                <th class="medium empView">Bought</th>
                                <th class="medium" id="up-sold">Unit Price</th>
                                <th class="medium custView">Unit Total</th>
                                <th class="medium empView">Tax</th>
                                <th class="fit">PP</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>
                                    <div id="addRowBtn"><img src="../images/general/add.svg"></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>

                </div>
            </div>

        </div>

        <div id="splitRight">

            <div id="additionalCharges">
                <label>Labor:</label>
                <input id="labor" type="number" step="0.01" min="0" placeholder="0.00">
                <br>

                <label>Credit Card Fee:</label>
                <input id="ccFee" type="number" step="0.01" min="0" placeholder="0.00">
                <br>

                <label>Shop Supplies:</label>
                <input id="shopSupplies" type="number" step="0.01" min="0" placeholder="0.00">
                <br>

                <label>External Work:</label>
                <input id="externalWork" type="number" step="0.01" min="0" placeholder="0.00">
                <br>

                <label>Plane & Degrease Heads:</label>
                <input id="planeAndDegreaseHeads" type="number" step="0.01" min="0" placeholder="0.00">
                <br>
            </div>

            <div id="notesContainer">
                <label>Notes:</label>
                <div id="notes"></div>
            </div>

        </div>
    </div>

    <script src="script.js" type="module" defer></script>

</body>

</html>
